name: publicar aplicativo web

# Publica o aplicativo do aluno no GitHub Pages, no endereço que o painel usa
# para montar o link da turma (DEFAULT_APP_URL em eyelearn/storage/store.py):
# https://tonbarbos.github.io/EyeLearn/
#
# O site só serve o aplicativo. A turma vai cifrada no próprio link, depois
# do "#", que o navegador não envia ao servidor: o GitHub nunca vê nome de
# aluno. O MediaPipe e o CanvasKit são servidos pelo próprio site, sem CDN de
# terceiros.
#
# Para funcionar uma vez: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/eyelearn_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Baixar o MediaPipe para navegador e o modelo (com conferência)
        working-directory: .
        run: python scripts/fetch_mediapipe_web.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Testar
        run: flutter test

      - name: Compilar
        # --no-web-resources-cdn: o CanvasKit vem do próprio site, não do
        # CDN do Google.
        #
        # A caixa de entrega (Supabase) vem das variáveis do repositório
        # (Settings > Secrets and variables > Actions > Variables):
        # SUPABASE_URL e SUPABASE_ANON_KEY. Sem elas, o site sai sem envio
        # automático, e a sessão vai por arquivo. A chave anon é pública por
        # natureza; o que ela pode fazer está em supabase/entregas.sql.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: >-
          flutter build web --release --no-web-resources-cdn --base-href /EyeLearn/
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/eyelearn_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
