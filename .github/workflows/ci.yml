name: testes

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A versão mínima declarada no pyproject e a atual. Rodar as duas
        # detecta uso acidental de recurso novo de linguagem.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        # Sem os extras de captura e interface: o pipeline de modelagem roda
        # sobre as bases públicas e não precisa de câmera nem de servidor
        # gráfico.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Rodar a suíte
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Guardar o relatório de cobertura
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml

  mutation:
    # O teste de mutação é lento demais para rodar a cada envio. Roda sob
    # demanda e no histórico da branch principal, onde o escore serve de
    # indicador de qualidade da suíte (seção 4.5 da metodologia).
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Rodar o teste de mutação
        run: |
          mutmut run --max-children 4 || true
          mutmut results
